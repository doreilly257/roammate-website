<!DOCTYPE html>
<html>
<head>
<title>Blog Image Audit</title>
<style>
* { box-sizing: border-box; }
body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; padding-bottom: 100px; }
h1 { text-align: center; color: #44cc44; margin-bottom: 5px; }
p.subtitle { text-align: center; color: #aaa; margin-top: 0; font-size: 13px; max-width: 900px; margin-left: auto; margin-right: auto; line-height: 1.5; }

/* Controls */
.controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.controls button { padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
.btn-green { background: #44cc44; color: #000; }
.btn-red { background: #ff4444; color: #fff; }
.btn-blue { background: #4488ff; color: #fff; }
.btn-cyan { background: #22aaaa; color: #fff; }
.btn-gray { background: #555; color: #fff; }
.btn-green:hover { background: #55dd55; }
.btn-red:hover { background: #ff6666; }
.btn-blue:hover { background: #5599ff; }
.btn-cyan:hover { background: #33bbbb; }
.btn-gray:hover { background: #777; }
.count-lbl { font-weight: bold; font-size: 13px; }
.c-green { color: #44cc44; }
.c-orange { color: #ff8800; }
.c-red { color: #ff4444; }
.c-cyan { color: #44cccc; }
.stats { text-align: center; color: #555; font-size: 11px; margin-bottom: 6px; }

/* Done button per post */
.post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.post-title { margin-bottom: 0; }
.done-btn { padding: 4px 12px; border: 2px solid #555; background: none; color: #888; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.15s; margin-left: auto; }
.done-btn:hover { border-color: #44cc44; color: #44cc44; }
.post-group.is-done { border-color: #44cc44; opacity: 0.6; }
.post-group.is-done .done-btn { background: #44cc44; color: #000; border-color: #44cc44; }
.post-group.is-done:hover { opacity: 0.85; }

/* Search input wrapper */
.search-input-wrap { position: relative; flex: 1; display: flex; }
#search-input { flex: 1; padding-right: 30px; }
.clear-input { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #776633; font-size: 18px; cursor: pointer; padding: 0; line-height: 1; }
.clear-input:hover { color: #ccaa44; }

/* ---- TOP PANELS: Holding + Search (sticky) ---- */
.top-panels { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: nowrap; position: sticky; top: 0; z-index: 90; padding: 10px 0; background: #111; align-items: flex-start; max-height: 45vh; }
.panel { border-radius: 10px; padding: 12px; flex: 1; min-width: 300px; }

/* Holding */
#holding-panel { background: #0a1e2e; border: 2px solid #44cccc; flex: 0 0 320px; min-width: 300px; max-height: 42vh; overflow-y: auto; }
#holding-panel h3 { color: #44cccc; margin: 0 0 8px; font-size: 14px; }
#holding-items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-height: 50px; }
.hold-slot { width: 100%; min-height: 65px; border: 2px dashed #2a4a5a; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s; position: relative; }
.hold-slot.drag-over { border-color: #44cccc; background: rgba(68,204,204,0.1); }
.hold-slot.has-card { border-style: solid; border-color: #44cccc; }
.hold-slot .empty-text { color: #2a4a5a; font-size: 10px; }

/* Search */
#search-panel { background: #1e1a0a; border: 2px solid #ccaa44; max-height: 42vh; overflow-y: auto; }
#search-panel h3 { color: #ccaa44; margin: 0 0 8px; font-size: 14px; }
.search-row { display: flex; gap: 8px; margin-bottom: 8px; }
#search-input { flex: 1; padding: 8px 10px; background: #2a2510; border: 1px solid #665522; color: #fff; border-radius: 6px; font-size: 13px; }
#search-input::placeholder { color: #776633; }
#search-btn { padding: 8px 16px; background: #ccaa44; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
#search-btn:hover { background: #ddbb55; }
#search-results { display: flex; gap: 8px; flex-wrap: wrap; min-height: 40px; }
#search-status { color: #776633; font-size: 11px; margin-bottom: 4px; }
.search-thumb { width: 120px; border-radius: 6px; overflow: hidden; border: 2px solid #665522; cursor: grab; position: relative; transition: border-color 0.15s; background: #1a1500; }
.search-thumb:hover { border-color: #ccaa44; }
.search-thumb.dragging { opacity: 0.3; }
.search-thumb img { width: 100%; height: 75px; object-fit: cover; display: block; pointer-events: none; }
.search-thumb .s-desc { padding: 3px 6px; font-size: 10px; color: #998855; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-thumb .s-new { position: absolute; top: 4px; left: 4px; background: #ccaa44; color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }

/* ---- POST GRID ---- */
.post-group { margin-bottom: 20px; border: 1px solid #333; border-radius: 10px; padding: 12px; background: #1a1a2e; }
.post-title { color: #ffcc00; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
.images-row { display: flex; gap: 8px; flex-wrap: wrap; min-height: 55px; align-items: flex-start; }
.slot { width: 210px; min-height: 165px; border: 2px dashed #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s; position: relative; }
.slot.drag-over { border-color: #44cc44; background: rgba(68,204,68,0.08); }
.slot.is-extra { border-color: #2a2a3e; border-style: dotted; opacity: 0.5; }
.slot.is-extra.drag-over { opacity: 1; }
.slot.is-extra.has-card { opacity: 1; border-style: dashed; border-color: #555; }
.slot-header { position: absolute; top: 3px; left: 7px; font-size: 9px; color: #555; font-weight: bold; text-transform: uppercase; z-index: 1; }
.slot-header.main { color: #777; }
.slot .empty-text { color: #3a3a3a; font-size: 11px; }

/* Cards (in post slots) */
.card { position: relative; border-radius: 6px; overflow: hidden; border: 3px solid #333; background: #0d0d1a; width: 206px; cursor: grab; transition: border-color 0.15s, transform 0.1s, opacity 0.15s; }
.card:hover { transform: scale(1.02); }
.card.dragging { opacity: 0.3; transform: scale(0.95); }
.card.liked { border-color: #44cc44 !important; }
.card.is-new { border-color: #ccaa44 !important; }
.card img { width: 100%; height: 130px; object-fit: cover; display: block; pointer-events: none; }
.card .number { position: absolute; top: 4px; left: 4px; background: rgba(255,0,0,0.85); color: #fff; font-weight: bold; font-size: 12px; padding: 2px 6px; border-radius: 4px; z-index: 2; }
.card.liked .number { background: rgba(68,204,68,0.9); }
.card.is-new .number { background: rgba(204,170,68,0.9); color: #000; }
.card .label { padding: 2px 5px; font-size: 9px; text-align: center; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .origin-badge { position: absolute; top: 4px; right: 4px; background: rgba(255,170,0,0.9); color: #000; font-weight: bold; font-size: 9px; padding: 1px 5px; border-radius: 3px; z-index: 2; display: none; }

/* Hold cards (smaller) */
.hold-card { position: relative; width: 100%; border-radius: 5px; overflow: hidden; border: 2px solid #44cccc; background: #0d0d1a; cursor: grab; }
.hold-card:hover { transform: scale(1.03); }
.hold-card.dragging { opacity: 0.3; }
.hold-card.liked { border-color: #44cc44 !important; }
.hold-card.is-new { border-color: #ccaa44 !important; }
.hold-card img { width: 100%; height: 60px; object-fit: cover; display: block; pointer-events: none; }
.hold-card .h-num { position: absolute; top: 3px; left: 3px; background: rgba(68,204,204,0.9); color: #000; font-weight: bold; font-size: 10px; padding: 1px 5px; border-radius: 3px; }
.hold-card.liked .h-num { background: rgba(68,204,68,0.9); color: #fff; }
.hold-card.is-new .h-num { background: rgba(204,170,68,0.9); }
.hold-card .h-label { padding: 2px 4px; font-size: 9px; color: #aaa; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- BIN (bottom) ---- */
#bin { position: fixed; bottom: 0; left: 0; right: 0; min-height: 55px; background: linear-gradient(to bottom, rgba(40,0,0,0.96), rgba(55,0,0,0.98)); border-top: 3px solid #ff4444; display: flex; align-items: center; gap: 10px; z-index: 100; padding: 6px 16px; transition: background 0.15s, min-height 0.15s; }
#bin.drag-over { background: rgba(80,0,0,0.98); min-height: 70px; border-top-color: #ff6666; }
#bin .bin-icon { font-size: 22px; flex-shrink: 0; }
#bin .bin-text { color: #ff8888; font-size: 13px; font-weight: bold; flex-shrink: 0; }
#bin .bin-items { display: flex; gap: 4px; overflow-x: auto; flex: 1; }
.bin-thumb { width: 45px; height: 32px; border-radius: 3px; overflow: hidden; border: 2px solid #ff4444; position: relative; cursor: pointer; flex-shrink: 0; }
.bin-thumb img { width: 100%; height: 100%; object-fit: cover; }
.bin-thumb .bin-num { position: absolute; top: 1px; left: 1px; background: rgba(255,0,0,0.85); color: #fff; font-size: 7px; font-weight: bold; padding: 0 2px; border-radius: 2px; }
.bin-thumb:hover { border-color: #ffaa44; }

/* Toast */
#toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 8px; font-weight: bold; font-size: 13px; z-index: 200; display: none; }

/* Zoom overlay */
#zoom-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 300; cursor: zoom-out; justify-content: center; align-items: center; }
#zoom-overlay.active { display: flex; }
#zoom-overlay img { max-width: 90vw; max-height: 85vh; border-radius: 10px; border: 3px solid #444; object-fit: contain; }
#zoom-label { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 14px; z-index: 301; background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 6px; display: none; }
#zoom-overlay.active + #zoom-label { display: block; }
</style>
</head>
<body>
<h1>Blog Images Audit</h1>
<p class="subtitle">
  <strong>Click</strong> = zoom. <strong>Double-click</strong> = like. <strong>Drag</strong> between slots (swaps).
  <strong>Holding</strong> = park images. <strong>Search</strong> = find new images. <strong>Bin</strong> = reject. <strong>Esc</strong> = close zoom.
</p>

<div class="controls">
  <span class="count-lbl c-green" id="liked-count">0 liked</span>
  <span class="count-lbl c-orange" id="moved-count">0 moved</span>
  <span class="count-lbl c-cyan" id="held-count">0 held</span>
  <span class="count-lbl c-red" id="binned-count">0 binned</span>
  <span class="count-lbl c-green" id="done-count">0/50 done</span>
  <button class="btn-green" id="copy-btn" onclick="copyAll()">Copy All</button>
  <button class="btn-blue" onclick="copyBinned()">Copy Binned</button>
  <button class="btn-cyan" onclick="saveToFile()">Save State</button>
  <button class="btn-gray" onclick="document.getElementById('load-file').click()">Load State</button>
  <input type="file" id="load-file" accept=".json" style="display:none" onchange="loadFromFile(event)">
  <button class="btn-red" onclick="clearAll()">Reset</button>
</div>
<div class="stats" id="stats"></div>

<!-- TOP PANELS -->
<div class="top-panels">
  <div class="panel" id="holding-panel">
    <h3>Holding Area <span id="hold-badge" style="font-size:12px;background:#44cccc;color:#000;padding:1px 7px;border-radius:10px;margin-left:6px;">0</span></h3>
    <div id="holding-items"></div>
  </div>
  <div class="panel" id="search-panel">
    <h3>Find New Images</h3>
    <div class="search-row">
      <div class="search-input-wrap">
        <input type="text" id="search-input" placeholder="e.g. backpacker hammock tropical, tuk tuk bangkok traffic...">
        <button class="clear-input" onclick="document.getElementById('search-input').value=''; document.getElementById('search-input').focus();" title="Clear">&times;</button>
      </div>
      <button id="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div id="search-status"></div>
    <div id="search-results"></div>
  </div>
</div>

<!-- POST GRID -->
<div id="container"></div>

<!-- BIN -->
<div id="bin">
  <span class="bin-icon">&#128465;</span>
  <span class="bin-text">Bin</span>
  <div class="bin-items" id="bin-items"></div>
  <button id="empty-bin-btn" onclick="emptyBin()" style="flex-shrink:0;padding:5px 12px;background:#ff4444;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer;display:none;">Empty Bin</button>
</div>
<div id="zoom-overlay" onclick="closeZoom()"><img id="zoom-img"></div>
<div id="zoom-label" onclick="closeZoom()"></div>
<div id="toast"></div>

<script>
const posts = [
  "adventure-day-risk-matrix","airport-day-efficiency-system","altitude-acclimatization-itinerary",
  "anti-theft-city-routines","backpacker-gym-alternatives","beach-town-vs-mountain-town-work",
  "border-crossing-document-pack","budget-travel-cashflow-playbook","burnout-signals-on-the-road",
  "carry-on-only-long-term","city-base-vs-fast-hopping","coastal-route-planning-framework",
  "couples-travel-systems","creator-workflow-while-traveling","cultural-site-day-planning",
  "first-month-southeast-asia","flexible-booking-strategy","food-safety-street-markets",
  "food-trail-by-neighborhood","hiking-rotation-for-multi-country-trips","hostel-selection-operator-checklist",
  "language-learning-travel-routine","local-sim-and-esim-strategy","long-haul-recovery-protocol",
  "long-trip-memory-capture","micro-adventure-in-major-cities","mountain-route-weather-windows",
  "night-bus-survival-guide","overnight-train-productivity","packing-cubes-real-usage",
  "photography-walk-planning","public-transport-mastery","rain-heat-humidity-gear-guide",
  "rainy-season-travel-advantage","region-hopping-without-exhaustion","remote-work-backpacking-rhythm",
  "scuba-snorkel-trip-integration","slow-travel-momentum-system","social-energy-management-abroad",
  "solo-female-travel-operations","storm-day-backup-plan","sunrise-sunset-shooting-workflow",
  "three-day-city-sprint-template","travel-day-mistakes-checklist","travel-finance-automation",
  "travel-insurance-claim-proofing","travel-workspace-setup-kit","visa-run-risk-reduction",
  "weekend-reset-for-digital-nomads","year-of-backpacking-strategy"
];
const typeLabels = ["hero", "inline-1", "inline-2"];
const EXTRA_SLOTS = 2;
const HOLD_SLOTS = 8;

const container = document.getElementById('container');
const binEl = document.getElementById('bin');
const binItemsEl = document.getElementById('bin-items');
const holdingItems = document.getElementById('holding-items');

// ============ STATE ============
let state = { placements: {}, liked: {}, binned: {}, newImages: {} };
// newImages: { "new_1": { photoId, thumb, desc, searchQuery } }
try {
  const saved = JSON.parse(localStorage.getItem('blogAuditV4') || '{}');
  if (saved.placements) state = saved;
} catch(e) {}
if (!state.placements) state.placements = {};
if (!state.liked) state.liked = {};
if (!state.binned) state.binned = {};
if (!state.newImages) state.newImages = {};
if (!state.donePosts) state.donePosts = {};

function save() { localStorage.setItem('blogAuditV4', JSON.stringify(state)); }

// Card info: original 150 images
const cardInfo = {};
let num = 1;
posts.forEach((slug, pi) => {
  typeLabels.forEach((type, ti) => {
    const origSlot = 'p' + (pi+1) + '-' + (ti+1);
    cardInfo[num] = { slug, type, origSlot, postIdx: pi+1, imgIdx: ti+1, isNew: false };
    num++;
  });
});

// New images also get card entries (IDs like "new_1", "new_2"...)
let newIdCounter = Object.keys(state.newImages).length;
for (const [nid, ninfo] of Object.entries(state.newImages)) {
  cardInfo[nid] = { slug: ninfo.desc || 'new image', type: 'new', origSlot: null, isNew: true, photoId: ninfo.photoId, thumb: ninfo.thumb, searchQuery: ninfo.searchQuery };
}

// Default placements for cards not placed anywhere
function isPlacedAnywhere(id) { return Object.values(state.placements).includes(id); }
for (let i = 1; i <= 150; i++) {
  const info = cardInfo[i];
  if (!state.binned[i] && !isPlacedAnywhere(i)) {
    state.placements[info.origSlot] = i;
  }
}

// Migrate any hold slots beyond HOLD_SLOTS cap back to available extra slots
for (const sid of Object.keys(state.placements)) {
  if (sid.startsWith('hold-') && parseInt(sid.split('-')[1]) > HOLD_SLOTS) {
    const cid = state.placements[sid];
    delete state.placements[sid];
    // Find first empty extra slot across all posts
    let placed = false;
    for (let pi = 0; pi < posts.length && !placed; pi++) {
      for (let si = 4; si <= 3 + EXTRA_SLOTS; si++) {
        const eSlot = 'p' + (pi+1) + '-' + si;
        if (!state.placements[eSlot]) { state.placements[eSlot] = cid; placed = true; break; }
      }
    }
    // If no extra slots, try empty hold slot within cap
    if (!placed) {
      for (let hi = 1; hi <= HOLD_SLOTS; hi++) {
        if (!state.placements['hold-' + hi]) { state.placements['hold-' + hi] = cid; placed = true; break; }
      }
    }
  }
}
save();

// DOM refs
const slotEls = {};
let dragId = null; // card id being dragged (number or "new_X")
let dragSourceSlot = null;
let dragIsSearch = false; // true if dragging from search results
let dragSearchData = null;

function findSlotForCard(id) {
  for (const [slotId, cid] of Object.entries(state.placements)) {
    if (cid === id) return slotId;
  }
  return null;
}

function imgSrc(id) {
  const info = cardInfo[id];
  if (!info) return '';
  if (info.isNew) {
    // Construct a stable URL from photoId (thumb URLs with ixid tokens can expire)
    if (info.photoId) return 'https://images.unsplash.com/photo-' + info.photoId + '?w=400&q=80&fm=jpg';
    return info.thumb;
  }
  return 'public/images/blog/' + info.slug + '-' + info.type + '.webp?t=3';
}

function cardLabel(id) {
  const info = cardInfo[id];
  if (!info) return '?';
  if (info.isNew) return (info.slug || 'new').substring(0, 25);
  return info.slug.replace(/-/g,' ').substring(0, 25) + ' ' + info.type;
}

// ============ SLOT DROP HANDLER ============
function setupSlotDrop(slot, slotId) {
  slot.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); slot.classList.add('drag-over'); });
  slot.addEventListener('dragleave', (e) => { e.stopPropagation(); slot.classList.remove('drag-over'); });
  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation(); // FIX: prevent bubbling to parent containers
    slot.classList.remove('drag-over');

    if (dragIsSearch && dragSearchData) {
      // New image from search
      handleSearchDrop(slotId);
    } else if (dragId !== null) {
      handleDrop(slotId, dragId, dragSourceSlot);
    }
  });
}

function handleDrop(targetSlotId, cardId, sourceSlotId) {
  const existingCard = state.placements[targetSlotId];

  if (existingCard && sourceSlotId) {
    state.placements[sourceSlotId] = existingCard;
  } else if (sourceSlotId) {
    delete state.placements[sourceSlotId];
  }

  state.placements[targetSlotId] = cardId;
  if (state.binned[cardId]) delete state.binned[cardId];

  save();
  rerenderSlot(targetSlotId);
  if (sourceSlotId) rerenderSlot(sourceSlotId);
  renderBin();
  updateCounts();

  const swapMsg = existingCard ? ' (swapped #' + existingCard + ')' : '';
  toast('Moved #' + cardId + ' to ' + slotLabel(targetSlotId) + swapMsg, '#44cc44');
}

function handleSearchDrop(targetSlotId) {
  const data = dragSearchData;
  if (!data) return;

  // Create a new card ID
  newIdCounter++;
  const nid = 'new_' + newIdCounter;

  state.newImages[nid] = { photoId: data.id, thumb: data.thumb, desc: data.desc, searchQuery: data.query };
  cardInfo[nid] = { slug: data.desc || 'new', type: 'new', origSlot: null, isNew: true, photoId: data.id, thumb: data.thumb, searchQuery: data.query };

  // If slot occupied, move existing card to holding
  const existing = state.placements[targetSlotId];
  if (existing) {
    // Find empty hold slot
    for (let hi = 1; hi <= HOLD_SLOTS; hi++) {
      const hid = 'hold-' + hi;
      if (!state.placements[hid]) { state.placements[hid] = existing; break; }
    }
  }

  state.placements[targetSlotId] = nid;
  save();
  rerenderSlot(targetSlotId);
  buildHolding();
  updateCounts();
  toast('New image placed in ' + slotLabel(targetSlotId), '#ccaa44');
}

function slotLabel(sid) {
  return sid.replace('p','').replace('hold-','holding ');
}

function rerenderSlot(slotId) {
  if (slotId.startsWith('hold')) { buildHolding(); return; }
  const slot = slotEls[slotId];
  if (!slot) return;
  const isExtra = parseInt(slotId.split('-')[1]) > 3;

  // Keep header, clear rest
  const header = slot.querySelector('.slot-header');
  while (slot.children.length > 1) slot.removeChild(slot.lastChild);

  const cn = state.placements[slotId];
  slot.classList.remove('has-card');
  if (cn && cardInfo[cn] && !state.binned[cn]) {
    slot.appendChild(buildCard(cn));
    slot.classList.add('has-card');
  } else {
    const e = document.createElement('div');
    e.className = 'empty-text';
    e.textContent = isExtra ? '+' : 'empty';
    slot.appendChild(e);
  }
}

// ============ BUILD CARDS ============
let didDrag = false;
function makeDraggable(el, id) {
  el.draggable = true;
  el.addEventListener('dragstart', (e) => {
    didDrag = true;
    dragId = id; dragSourceSlot = findSlotForCard(id); dragIsSearch = false; dragSearchData = null;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(id));
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    dragId = null; dragSourceSlot = null; dragIsSearch = false;
  });
}

function makeClickable(el, id) {
  let clickTimer = null;
  el.addEventListener('mousedown', () => { didDrag = false; });
  el.addEventListener('click', (e) => {
    if (didDrag) { didDrag = false; return; }
    // Wait briefly to see if it's a double-click
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
    clickTimer = setTimeout(() => { clickTimer = null; openZoom(id); }, 250);
  });
  el.addEventListener('dblclick', (e) => {
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    if (state.liked[id]) { delete state.liked[id]; el.classList.remove('liked'); }
    else { state.liked[id] = true; el.classList.add('liked'); }
    save(); updateCounts();
  });
}

function buildCard(id) {
  const info = cardInfo[id];
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = id;
  if (state.liked[id]) card.classList.add('liked');
  if (info.isNew) card.classList.add('is-new');

  const badge = document.createElement('div');
  badge.className = 'number';
  badge.textContent = info.isNew ? 'NEW' : '#' + id;

  const originBadge = document.createElement('div');
  originBadge.className = 'origin-badge';
  const curSlot = findSlotForCard(id);
  if (curSlot && info.origSlot && curSlot !== info.origSlot) {
    originBadge.style.display = 'block';
    originBadge.textContent = 'was ' + info.origSlot.replace('p','');
  }

  const img = document.createElement('img');
  img.src = imgSrc(id);
  img.loading = 'lazy';
  img.onerror = function() { this.style.background = '#ff0000'; };

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = cardLabel(id);

  card.appendChild(badge);
  card.appendChild(originBadge);
  card.appendChild(img);
  card.appendChild(label);

  makeClickable(card, id);
  makeDraggable(card, id);
  return card;
}

function buildHoldCard(id) {
  const info = cardInfo[id];
  const card = document.createElement('div');
  card.className = 'hold-card';
  card.dataset.id = id;
  if (state.liked[id]) card.classList.add('liked');
  if (info.isNew) card.classList.add('is-new');

  const badge = document.createElement('div');
  badge.className = 'h-num';
  badge.textContent = info.isNew ? 'NEW' : '#' + id;

  const img = document.createElement('img');
  img.src = imgSrc(id);
  img.loading = 'lazy';

  const label = document.createElement('div');
  label.className = 'h-label';
  label.textContent = cardLabel(id);

  card.appendChild(badge);
  card.appendChild(img);
  card.appendChild(label);

  makeClickable(card, id);
  makeDraggable(card, id);
  return card;
}

// ============ STATE: done posts ============
if (!state.donePosts) state.donePosts = {};

// ============ BUILD POST GRID ============
posts.forEach((slug, pi) => {
  const postNum = pi + 1;
  const group = document.createElement('div');
  group.className = 'post-group';
  group.dataset.post = postNum;
  if (state.donePosts[postNum]) group.classList.add('is-done');

  const header = document.createElement('div');
  header.className = 'post-header';

  const title = document.createElement('div');
  title.className = 'post-title';
  title.textContent = 'Post ' + postNum + ': ' + slug.replace(/-/g, ' ');

  const doneBtn = document.createElement('button');
  doneBtn.className = 'done-btn';
  doneBtn.textContent = state.donePosts[postNum] ? 'Done' : 'Mark Done';
  doneBtn.addEventListener('click', () => {
    if (state.donePosts[postNum]) {
      delete state.donePosts[postNum];
      group.classList.remove('is-done');
      doneBtn.textContent = 'Mark Done';
    } else {
      state.donePosts[postNum] = true;
      group.classList.add('is-done');
      doneBtn.textContent = 'Done';
    }
    save();
    updateCounts();
  });

  header.appendChild(title);
  header.appendChild(doneBtn);
  group.appendChild(header);

  const row = document.createElement('div');
  row.className = 'images-row';

  for (let si = 0; si < 3 + EXTRA_SLOTS; si++) {
    const slotId = 'p' + (pi+1) + '-' + (si+1);
    const isExtra = si >= 3;

    const slot = document.createElement('div');
    slot.className = 'slot' + (isExtra ? ' is-extra' : '');
    slot.dataset.slotId = slotId;
    slotEls[slotId] = slot;

    const header = document.createElement('div');
    header.className = 'slot-header' + (isExtra ? '' : ' main');
    header.textContent = isExtra ? 'extra' : typeLabels[si];
    slot.appendChild(header);

    const cn = state.placements[slotId];
    if (cn && cardInfo[cn] && !state.binned[cn]) {
      slot.appendChild(buildCard(cn));
      slot.classList.add('has-card');
    } else {
      const e = document.createElement('div');
      e.className = 'empty-text';
      e.textContent = isExtra ? '+' : 'empty';
      slot.appendChild(e);
    }

    setupSlotDrop(slot, slotId);
    row.appendChild(slot);
  }

  group.appendChild(row);
  container.appendChild(group);
});

// ============ HOLDING AREA ============
function buildHolding() {
  holdingItems.textContent = '';
  // Hard cap at HOLD_SLOTS (8)
  for (let hi = 1; hi <= HOLD_SLOTS; hi++) {
    const slotId = 'hold-' + hi;
    const slot = document.createElement('div');
    slot.className = 'hold-slot';
    slot.dataset.slotId = slotId;
    slotEls[slotId] = slot;

    const cn = state.placements[slotId];
    if (cn && cardInfo[cn] && !state.binned[cn]) {
      slot.appendChild(buildHoldCard(cn));
      slot.classList.add('has-card');
    } else {
      const e = document.createElement('div');
      e.className = 'empty-text';
      e.textContent = '+';
      slot.appendChild(e);
    }

    setupSlotDrop(slot, slotId);
    holdingItems.appendChild(slot);
  }
}

// Drop on holding panel itself -> first empty hold slot
document.getElementById('holding-panel').addEventListener('dragover', (e) => { e.preventDefault(); });
document.getElementById('holding-panel').addEventListener('drop', (e) => {
  e.preventDefault();
  // Only handle if not already caught by a hold-slot
  if (e.target.closest('.hold-slot')) return;

  let targetSlot = null;
  for (let hi = 1; hi <= HOLD_SLOTS; hi++) {
    const sid = 'hold-' + hi;
    if (!state.placements[sid]) { targetSlot = sid; break; }
  }
  if (!targetSlot) { toast('Holding full!', '#ff4444'); return; }

  if (dragIsSearch && dragSearchData) {
    handleSearchDrop(targetSlot);
  } else if (dragId !== null) {
    handleDrop(targetSlot, dragId, dragSourceSlot);
  }
});

// ============ SEARCH ============
let searchPage = 1;
let lastSearchQuery = '';
document.getElementById('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;

  // If same query, advance page for fresh results; if new query, reset to page 1
  if (q === lastSearchQuery) {
    searchPage++;
  } else {
    searchPage = 1;
    lastSearchQuery = q;
  }

  document.getElementById('search-status').textContent = 'Searching (page ' + searchPage + ')...';
  document.getElementById('search-results').textContent = '';

  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q) + '&page=' + searchPage);
    const allResults = await res.json();
    const results = allResults.slice(0, 24); // max 24 results

    if (!results.length) {
      document.getElementById('search-status').textContent = 'No free results on page ' + searchPage + '. Try different terms.';
      searchPage = 0; // next click will go to page 1
      return;
    }

    document.getElementById('search-status').textContent = results.length + ' results (page ' + searchPage + '). Drag into any slot. Click Search again for more.';
    const container = document.getElementById('search-results');

    results.forEach(r => {
      const thumb = document.createElement('div');
      thumb.className = 'search-thumb';
      thumb.draggable = true;

      const newBadge = document.createElement('div');
      newBadge.className = 's-new';
      newBadge.textContent = 'NEW';

      const img = document.createElement('img');
      img.src = r.thumb;

      const desc = document.createElement('div');
      desc.className = 's-desc';
      desc.textContent = r.desc || q;

      thumb.appendChild(newBadge);
      thumb.appendChild(img);
      thumb.appendChild(desc);

      // Drag
      let thumbDragged = false;
      thumb.addEventListener('mousedown', () => { thumbDragged = false; });
      thumb.addEventListener('dragstart', (e) => {
        thumbDragged = true;
        dragId = null; dragSourceSlot = null; dragIsSearch = true;
        dragSearchData = { id: r.id, thumb: r.thumb, desc: r.desc || q, query: q };
        thumb.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'copy';
        e.dataTransfer.setData('text/plain', 'search:' + r.id);
      });
      thumb.addEventListener('dragend', () => {
        thumb.classList.remove('dragging');
        dragIsSearch = false; dragSearchData = null;
      });

      // Click to zoom (use larger Unsplash URL)
      thumb.addEventListener('click', () => {
        if (thumbDragged) { thumbDragged = false; return; }
        const bigUrl = r.thumb.replace(/w=\d+/, 'w=1200').replace(/fit=max/, 'fit=max');
        document.getElementById('zoom-img').src = bigUrl;
        document.getElementById('zoom-overlay').classList.add('active');
        document.getElementById('zoom-label').textContent = r.desc || q;
        document.getElementById('zoom-label').style.display = 'block';
      });

      container.appendChild(thumb);
    });
  } catch(err) {
    document.getElementById('search-status').textContent = 'Error: ' + err.message + '. Is audit-server.mjs running?';
  }
}

// ============ BIN ============
binEl.addEventListener('dragover', (e) => { e.preventDefault(); binEl.classList.add('drag-over'); });
binEl.addEventListener('dragleave', () => { binEl.classList.remove('drag-over'); });
binEl.addEventListener('drop', (e) => {
  e.preventDefault(); binEl.classList.remove('drag-over');
  if (dragIsSearch) return; // can't bin search results
  if (dragId === null) return;
  const id = dragId;
  const src = dragSourceSlot;
  state.binned[id] = true;
  delete state.liked[id];
  if (src) { delete state.placements[src]; rerenderSlot(src); }
  save(); renderBin(); updateCounts();
  toast('Binned #' + id, '#ff4444');
});

function renderBin() {
  binItemsEl.textContent = '';
  const keys = Object.keys(state.binned).sort((a,b) => {
    const na = parseInt(a) || 9999; const nb = parseInt(b) || 9999;
    return na - nb;
  });
  keys.forEach(id => {
    const info = cardInfo[id];
    if (!info) return;
    const thumb = document.createElement('div');
    thumb.className = 'bin-thumb';
    thumb.title = '#' + id + ' ' + cardLabel(id) + ' — click to restore';

    const img = document.createElement('img');
    img.src = imgSrc(id);
    const numB = document.createElement('div');
    numB.className = 'bin-num';
    numB.textContent = typeof id === 'number' || !String(id).startsWith('new') ? id : 'N';
    thumb.appendChild(img);
    thumb.appendChild(numB);

    thumb.addEventListener('click', () => {
      delete state.binned[id];
      let target = null;
      if (info.origSlot && !state.placements[info.origSlot]) { target = info.origSlot; }
      else {
        for (let hi = 1; hi <= HOLD_SLOTS; hi++) {
          const sid = 'hold-' + hi;
          if (!state.placements[sid]) { target = sid; break; }
        }
      }
      if (target) { state.placements[target] = id; rerenderSlot(target); }
      save(); renderBin(); updateCounts();
      toast('Restored #' + id, '#44cc44');
    });

    binItemsEl.appendChild(thumb);
  });
  document.getElementById('empty-bin-btn').style.display = keys.length ? 'block' : 'none';
}

function emptyBin() {
  const count = Object.keys(state.binned).length;
  if (!count) return;
  if (!confirm('Permanently discard ' + count + ' binned image(s)? They won\'t be restorable.')) return;
  state.binned = {};
  save(); renderBin(); updateCounts();
  toast('Bin emptied', '#ff4444');
}

// ============ SAVE / LOAD ============
function saveToFile() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'blog-audit-state.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('State saved to file', '#44cccc');
}

function loadFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const loaded = JSON.parse(e.target.result);
      if (loaded.placements) {
        state = loaded;
        if (!state.newImages) state.newImages = {};
        if (!state.donePosts) state.donePosts = {};
        // Rebuild newImages cardInfo
        for (const [nid, ninfo] of Object.entries(state.newImages)) {
          cardInfo[nid] = { slug: ninfo.desc || 'new', type: 'new', origSlot: null, isNew: true, photoId: ninfo.photoId, thumb: ninfo.thumb, searchQuery: ninfo.searchQuery };
        }
        save();
        location.reload();
      } else {
        toast('Invalid state file', '#ff4444');
      }
    } catch(err) {
      toast('Failed to load: ' + err.message, '#ff4444');
    }
  };
  reader.readAsText(file);
}

// ============ COUNTS ============
function updateCounts() {
  const likedN = Object.keys(state.liked).length;
  const binnedN = Object.keys(state.binned).length;
  let movedN = 0, heldN = 0;
  for (const [slotId, cid] of Object.entries(state.placements)) {
    const info = cardInfo[cid];
    if (!info) continue;
    if (slotId.startsWith('hold')) heldN++;
    else if (info.origSlot && slotId !== info.origSlot) movedN++;
    else if (info.isNew) movedN++; // new images count as moved
  }
  const doneN = Object.keys(state.donePosts || {}).length;
  document.getElementById('liked-count').textContent = likedN + ' liked';
  document.getElementById('moved-count').textContent = movedN + ' moved';
  document.getElementById('held-count').textContent = heldN + ' held';
  document.getElementById('binned-count').textContent = binnedN + ' binned';
  document.getElementById('done-count').textContent = doneN + '/50 done';
  document.getElementById('hold-badge').textContent = heldN;
}

function toast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || '#44cc44';
  t.style.color = (color === '#ff4444' || color === '#ccaa44') ? '#fff' : '#000';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 2000);
}

// ============ COPY ============
function copyAll() {
  const lines = [];
  const likedKeys = Object.keys(state.liked).sort();
  if (likedKeys.length) { lines.push('LIKED: ' + likedKeys.map(n => '#' + n).join(', ')); lines.push(''); }

  // Moves
  const moves = [];
  const newPlacements = [];
  for (const [slotId, cid] of Object.entries(state.placements)) {
    const info = cardInfo[cid];
    if (!info) continue;
    if (info.isNew && !slotId.startsWith('hold')) {
      newPlacements.push({ slotId, info, cid });
    } else if (info.origSlot && slotId !== info.origSlot && !slotId.startsWith('hold')) {
      moves.push({ cid, from: info.origSlot, to: slotId, info });
    }
  }
  if (moves.length) {
    moves.sort((a,b) => (parseInt(a.cid)||0) - (parseInt(b.cid)||0));
    lines.push('MOVES:');
    moves.forEach(m => {
      lines.push('#' + m.cid + ' (' + cardLabel(m.cid) + ') ' + slotLabel(m.from) + ' -> ' + slotLabel(m.to));
    });
    lines.push('');
  }

  // New images
  if (newPlacements.length) {
    lines.push('NEW IMAGES:');
    newPlacements.forEach(np => {
      const ni = state.newImages[np.cid];
      lines.push(slotLabel(np.slotId) + ': photo-' + ni.photoId + ' ("' + (ni.desc || ni.searchQuery) + '")');
    });
    lines.push('');
  }

  // Binned
  const binKeys = Object.keys(state.binned).sort((a,b) => (parseInt(a)||0) - (parseInt(b)||0));
  if (binKeys.length) {
    lines.push('BINNED (replace these):');
    binKeys.forEach(id => { lines.push('#' + id + ' ' + cardLabel(id)); });
  }

  if (!lines.length) { toast('Nothing to copy', '#555'); return; }
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    document.getElementById('copy-btn').textContent = 'Copied!';
    setTimeout(() => { document.getElementById('copy-btn').textContent = 'Copy All'; }, 1500);
  });
}

function copyBinned() {
  const binKeys = Object.keys(state.binned).sort((a,b) => (parseInt(a)||0) - (parseInt(b)||0));
  if (!binKeys.length) { toast('No binned images', '#555'); return; }
  const lines = binKeys.map(id => '#' + id + ' ' + cardLabel(id));
  navigator.clipboard.writeText('REPLACE THESE:\n' + lines.join('\n')).then(() => toast('Copied!', '#44cc44'));
}

function clearAll() {
  if (!confirm('Reset everything? This clears all likes, moves, bins, done states, and new images.')) return;
  localStorage.removeItem('blogAuditV4');
  location.reload();
}

// ============ ZOOM ============
function openZoom(id) {
  const src = imgSrc(id);
  const label = cardLabel(id);
  document.getElementById('zoom-img').src = src;
  document.getElementById('zoom-overlay').classList.add('active');
  document.getElementById('zoom-label').textContent = '#' + id + ' — ' + label;
  document.getElementById('zoom-label').style.display = 'block';
}
function closeZoom() {
  document.getElementById('zoom-overlay').classList.remove('active');
  document.getElementById('zoom-label').style.display = 'none';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });

// ============ INIT ============
buildHolding();
renderBin();
updateCounts();
document.getElementById('stats').textContent = posts.length + ' posts, ' + (posts.length*3) + ' images. Slots: X-1=hero, X-2=inline-1, X-3=inline-2. Drag to swap. State auto-saves to browser.';
</script>
</body>
